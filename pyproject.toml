[tool.ruff]
line-length = 100
target-version = "py311"

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "integration: tests that hit real external APIs (skipped by default without live keys)",
    "network: tests that need internet access to an external dataset host (e.g. Hugging Face Hub) — blocked in this dev sandbox, fine on your server or in CI",
]
